name: Test source tooling

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python3 -m unittest discover -s tests -v
      - name: Validate all published catalogs
        run: |
          for source in public/*.json; do
            case "$source" in
              public/apps.json|public/repo.json)
                python3 scripts/validate_source.py --allow-duplicate-bundles "$source" ;;
              *) python3 scripts/validate_source.py "$source" ;;
            esac
          done
