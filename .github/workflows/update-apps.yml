name: Update apps

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Redownload and verify all current IPAs
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test updater
        run: python3 -m unittest discover -s tests -v

      - name: Check official releases and update source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH: ${{ inputs.refresh }}
        run: |
          if [ "$REFRESH" = "true" ]; then
            python3 scripts/update_source.py --refresh
          else
            python3 scripts/update_source.py
          fi

      - name: Validate generated source
        run: |
          for source in public/*.json; do
            python3 -m json.tool "$source" >/dev/null
            case "$source" in
              public/apps.json|public/repo.json)
                python3 scripts/validate_source.py --allow-duplicate-bundles "$source" ;;
              *)
                python3 scripts/validate_source.py "$source" ;;
            esac
          done

      - name: Commit a new IPA version
        run: |
          git add public/*.json state/releases.json
          if git diff --cached --quiet; then
            echo "No new IPA version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update app source"
          git push
