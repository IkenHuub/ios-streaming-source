name: Update apps

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-apps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check official releases and update source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_source.py

      - name: Validate generated source
        run: |
          for source in public/*.json; do
            python3 -m json.tool "$source" >/dev/null
            case "$source" in
              public/apps.json|public/repo.json)
                python3 scripts/validate_source.py --allow-duplicate-bundles "$source" ;;
              *)
                python3 scripts/validate_source.py "$source" ;;
            esac
          done

      - name: Commit a new IPA version
        run: |
          if git diff --quiet; then
            echo "No new IPA version"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/*.json state/releases.json
          git commit -m "Update app source"
          git push
